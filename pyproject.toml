[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamiclh2poolx"
version = "0.2.0.dev0"
description = "Transparent liquid-hydrogen pool source terms for declared ground inflow"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ugwiyeon Lee" }]
keywords = ["liquid hydrogen", "LH2", "pool evaporation", "source term", "process safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["CoolProp>=6.5", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "openpyxl>=3.1", "matplotlib>=3.8"]

[project.urls]
Source = "https://github.com/lyullee/DynamicLH2PoolX"
Documentation = "https://github.com/lyullee/DynamicLH2PoolX#readme"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "data", "requirements-validation.txt", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff"]

[tool.hatch.build.targets.wheel]
packages = ["src/dynamiclh2poolx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
